spring.application.name = exam-portal-backend
server.port = 8080
server.error.include-message = always
server.error.include-binding-error = always

spring.datasource.url = jdbc:mysql://localhost:3306/exam_portal_db
spring.datasource.username = root
spring.datasource.password = mypassword@8018
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = false
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.properties.hibernate.use_sql_comments = true
spring.jpa.properties.hibernate.default_batch_fetch_size = 20
spring.jpa.properties.hibernate.jdbc.batch_size = 20
spring.jpa.properties.hibernate.order_inserts = true
spring.jpa.properties.hibernate.order_updates = true
spring.jpa.open-in-view = false

spring.datasource.hikari.maximum-pool-size = 10
spring.datasource.hikari.minimum-idle = 5
spring.datasource.hikari.connection-timeout = 30000
spring.datasource.hikari.idle-timeout = 600000
spring.datasource.hikari.max-lifetime = 1800000
spring.datasource.hikari.pool.name = ExamPortalHikariPool