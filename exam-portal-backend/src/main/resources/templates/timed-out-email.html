<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="margin:0;padding:0;background:#07071a;
             font-family:'Segoe UI',Arial,sans-serif;">
<div style="max-width:600px;margin:40px auto;
            background:#12122e;border-radius:20px;
            overflow:hidden;
            border:1px solid rgba(245,158,11,0.3);">

    <div style="background:linear-gradient(135deg,
              #92400e,#b45309);
              padding:32px;text-align:center;">
        <h1 style="color:#fff;margin:0;font-size:24px;">
            ⏰ Exam Time Expired
        </h1>
        <p style="color:rgba(255,255,255,0.8);margin:6px 0 0;"
           th:text="${examTitle}"></p>
    </div>

    <div style="padding:28px 36px 0;">
        <div style="background:rgba(245,158,11,0.08);
                border:1px solid rgba(245,158,11,0.25);
                border-radius:12px;padding:16px 20px;">
            <p style="color:#fbbf24;font-size:14px;margin:0;">
                ⚠️ Your exam time has expired and your answers have been
                <strong>automatically submitted</strong>.
            </p>
        </div>
    </div>

    <div style="padding:28px 36px;">
        <p style="color:#a8a6c8;font-size:15px;margin:0 0 20px;">
            Hello <strong style="color:#f1f0ff;"
                          th:text="${name}"></strong>,
            here are your auto-submitted results:
        </p>

        <div style="background:#0d0d24;border-radius:14px;
                padding:24px;text-align:center;margin-bottom:20px;">
            <div style="font-size:48px;font-weight:700;
                  color:#a78bfa;line-height:1;">
                <span th:text="${score}"></span>
                <span style="font-size:24px;color:#6b6890;">
          / <span th:text="${totalMarks}"></span>
        </span>
            </div>
            <div style="font-size:18px;color:#e2e0ff;margin:8px 0;"
                 th:text="${percentage + '%'}"></div>
            <span th:if="${passed}"
                  style="display:inline-block;background:#065f46;
                   color:#6ee7b7;padding:6px 20px;
                   border-radius:20px;font-size:13px;">
        ✅ PASSED
      </span>
            <span th:unless="${passed}"
                  style="display:inline-block;background:#7f1d1d;
                   color:#fca5a5;padding:6px 20px;
                   border-radius:20px;font-size:13px;">
        ❌ FAILED
      </span>
        </div>

        <table style="width:100%;border-collapse:collapse;
                  font-size:14px;">
            <tr style="border-bottom:1px solid rgba(139,92,246,0.1);">
                <td style="padding:10px 0;color:#6b6890;">Correct</td>
                <td style="color:#10b981;text-align:right;font-weight:600;"
                    th:text="${correct}"></td>
            </tr>
            <tr style="border-bottom:1px solid rgba(139,92,246,0.1);">
                <td style="padding:10px 0;color:#6b6890;">Wrong</td>
                <td style="color:#ef4444;text-align:right;font-weight:600;"
                    th:text="${wrong}"></td>
            </tr>
            <tr style="border-bottom:1px solid rgba(139,92,246,0.1);">
                <td style="padding:10px 0;color:#6b6890;">Unanswered</td>
                <td style="color:#f59e0b;text-align:right;"
                    th:text="${unanswered}"></td>
            </tr>
            <tr>
                <td style="padding:10px 0;color:#6b6890;">Time Used</td>
                <td style="color:#a8a6c8;text-align:right;"
                    th:text="${timeTaken}"></td>
            </tr>
        </table>
    </div>

    <div style="background:#0d0d24;padding:16px;text-align:center;
              border-top:1px solid rgba(245,158,11,0.15);">
        <p style="color:#4a4870;font-size:11px;margin:0;">
            © 2024 ExamPortal. All rights reserved.
        </p>
    </div>
</div>
</body>
</html>
